name: Code Quality Check

on: [push] # The trigger: run every time you push code

jobs:
  lint:
    runs-on: ubuntu-latest # GitHub spins up a fresh Linux VM for you
    
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. Install Depedencies 
        run: |
          pip install ruff pytest 
          pip install -r requirements.txt 

      - name: 4) Run Ruff (Typos + Bugs) 
        run: ruff check automation_engine.py

      - name: 5) Run Logic Tests 
        run: pytest test_logic.py
